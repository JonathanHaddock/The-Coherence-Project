<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORIGIN Front Porch</title>
<style>
:root{--bg:#0e1013;--panel:#171a1f;--ink:#e6e8eb;--dim:#8a919c;--line:#2a2f37;--acc:#f5b942;--ag:#5cc8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{font-size:15px;margin:0;letter-spacing:.04em}header span{color:var(--dim);font-size:12px}
main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;padding:16px;align-items:start}
@media(max-width:760px){main{grid-template-columns:1fr}}
nav{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
nav h2,.card h2{font-size:11px;font-weight:600;color:var(--dim);margin:10px 8px 6px;text-transform:uppercase;letter-spacing:.06em}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--ink);font:inherit;font-size:13px;padding:7px 8px;border-radius:5px;cursor:pointer}
nav button:hover{background:#1e2228}
nav button.sel{border-color:var(--acc);color:var(--acc)}
nav button i{font-style:normal;color:var(--dim);font-size:11px}
nav button .pin{color:var(--ag)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 8px}
.title{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.title h3{margin:0;font-size:18px}
.btn{display:inline-block;background:#0e1013;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--acc)}.btn.on{border-color:var(--ag);color:var(--ag)}
code,.cmd{background:#0e1013;border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:12px}
.cmd{display:block;padding:8px 10px;margin:4px 0;white-space:pre-wrap;word-break:break-all}
pre.sum{white-space:pre-wrap;word-break:break-word;background:#0e1013;border-radius:6px;padding:10px;max-height:340px;overflow:auto;font-size:12px;margin:0}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files a{color:var(--ag);font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:3px 7px}
.files a:hover{border-color:var(--ag)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.thumbs a{display:block;background:#fff;border-radius:6px;overflow:hidden}
.thumbs img{display:block;width:100%;height:140px;object-fit:contain}
section+section{margin-top:16px}
.dim{color:var(--dim);font-size:12px}
textarea{width:100%;min-height:80px;background:#0e1013;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;font-size:12px}
</style></head><body>
<header><h1>ORIGIN · FRONT PORCH</h1><span>Pick an experiment to work on. Generated by <code>origin porch</code>; rerun it to pick up new folders.</span></header>
<main>
<nav id="nav"></nav>
<div class="card" id="detail"></div>
</main>
<script>
const DATA = /*PORCH_DATA*/;
// Engine tools live in origin/ itself, not in experiments/.
const TOOLS = [
 {id:"tool:one-pixel", name:"one pixel", tag:"new",
  about:"Model of one pixel engine (Rule Spec v0): three cells on the lepton points, the node scaffold at the south pole, neutrino memory. One beta decay = quark, electron and neutrino flash across five nodes, with the charge ledger checked.",
  open:"../viewer/pixel.html", cmds:["zig-out/bin/origin onepixel 100 row n2 t","zig-out/bin/origin onepixel 100 bipyramid t","zig build test"], exp:"one-pixel"},
 {id:"tool:engine3d", name:"pixel engine 3D", tag:"viewer",
  about:"48³ lattice viewer: lattice, lepton v1/signed/turing and control modes, decay-test chart. See HANDOFF-engine.md.",
  open:"../viewer/index.html", cmds:["zig-out/bin/origin record mode=lattice display=one_cell core=8 ticks=1500","zig-out/bin/origin lattice3 one_cell sync 8 1500"]},
 {id:"tool:sweep", name:"parameter sweep 2026-11-10", tag:"results",
  about:"132 recorded runs over every existing lattice / lepton / control setting, 3 seeds each. Summary in SUMMARY.md.",
  open:"sweep-2026-11-10/SUMMARY.md", cmds:["cat results/sweep-2026-11-10/SUMMARY.md"]},
 {id:"tool:explorer", name:"ORIGIN explorer", tag:"app",
  about:"Projector explorer: sliders and presets for your own vector, triangle and D axis, PMNS/CKM data.",
  open:"app.html", cmds:["zig-out/bin/origin app"]},
 {id:"tool:collider", name:"collider data", tag:"CMS",
  about:"CMS 2011A dimuon and Z→ee open data: spectra, resonances, event displays.",
  open:"Dimuon_DoubleMu-mass.svg", cmds:["scripts/fetch.sh","zig-out/bin/origin analyze","zig-out/bin/origin display Zmumu 0"]},
];
const store = {
 get(k,d){try{const v=localStorage.getItem("porch:"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem("porch:"+k,JSON.stringify(v))}catch(e){}}
};
const exps = DATA.experiments.map(e=>({...e,id:"exp:"+e.name}));
let sel = store.get("sel", TOOLS[0].id);
let pins = store.get("pins", []);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function navItem(x, tag){
  const b=document.createElement("button");
  b.className = x.id===sel?"sel":"";
  b.innerHTML = `<span>${pins.includes(x.id)?'<span class="pin">● </span>':''}${esc(x.name)}</span><i>${esc(tag)}</i>`;
  b.onclick=()=>{sel=x.id;store.set("sel",sel);render()};
  return b;
}
function render(){
  const nav=document.getElementById("nav"); nav.innerHTML="";
  const pinned=[...TOOLS,...exps].filter(x=>pins.includes(x.id));
  if(pinned.length){const h=document.createElement("h2");h.textContent="Working on";nav.append(h);pinned.forEach(x=>nav.append(navItem(x,x.tag||"")))}
  let h=document.createElement("h2");h.textContent="Engine";nav.append(h);
  TOOLS.forEach(t=>nav.append(navItem(t,t.tag)));
  h=document.createElement("h2");h.textContent=`Experiments (${exps.length})`;nav.append(h);
  exps.forEach(e=>nav.append(navItem(e,e.files.length+" files")));
  detail();
}
function pinBtn(id){
  const on=pins.includes(id);
  return `<button class="btn ${on?'on':''}" id="pin">${on?'● working on':'○ mark working on'}</button>`;
}
function notesBox(id){
  return `<section><h2>Notes (this browser only)</h2><textarea id="notes" placeholder="Where you left off...">${esc(store.get("notes:"+id,""))}</textarea></section>`;
}
function detail(){
  const d=document.getElementById("detail");
  const t=TOOLS.find(x=>x.id===sel); const e=exps.find(x=>x.id===sel);
  if(t){
    d.innerHTML=`<div class="title"><h3>${esc(t.name)}</h3><a class="btn" href="${t.open}" target="_blank">Open ↗</a>${pinBtn(t.id)}</div>
    <p>${esc(t.about)}</p>
    <section><h2>Run from origin/</h2>${t.cmds.map(c=>`<span class="cmd">${esc(c)}</span>`).join("")}</section>
    ${t.exp?`<p class="dim">Its notes folder is <code>experiments/${esc(t.exp)}</code>, listed under Experiments.</p>`:""}
    ${notesBox(t.id)}`;
  } else if(e){
    const base=`../../experiments/${encodeURIComponent(e.name)}/`;
    const imgs=e.files.filter(f=>/\.(png|svg|jpg)$/i.test(f));
    const py=e.files.filter(f=>/\.py$/.test(f));
    const runner=py.includes("run.py")?"run.py":py[0];
    d.innerHTML=`<div class="title"><h3>${esc(e.name)}</h3>${pinBtn(e.id)}</div>
    ${runner?`<section><h2>Run from the repo root</h2><span class="cmd">cd experiments/${esc(e.name)} &amp;&amp; python3 ${esc(runner)}</span></section>`:""}
    <section><h2>Summary</h2>${e.summary?`<pre class="sum">${esc(e.summary)}</pre>`:`<p class="dim">No README.md, RESULTS.md or summary.txt yet.</p>`}</section>
    ${imgs.length?`<section><h2>Charts</h2><div class="thumbs">${imgs.map(f=>`<a href="${base+encodeURIComponent(f)}" target="_blank" title="${esc(f)}"><img src="${base+encodeURIComponent(f)}" alt="${esc(f)}"></a>`).join("")}</div></section>`:""}
    <section><h2>Files</h2><div class="files">${e.files.map(f=>`<a href="${base+f.split("/").map(encodeURIComponent).join("/")}" target="_blank">${esc(f)}</a>`).join("")}</div></section>
    ${notesBox(e.id)}`;
  } else { sel=TOOLS[0].id; return render(); }
  document.getElementById("pin").onclick=()=>{pins=pins.includes(sel)?pins.filter(x=>x!==sel):[...pins,sel];store.set("pins",pins);render()};
  document.getElementById("notes").oninput=ev=>store.set("notes:"+sel,ev.target.value);
}
render();
</script>
</body></html>
